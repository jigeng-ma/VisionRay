; ============================================================================
; OTA任务配置：填写 task_id 与 version。version 是眼镜升级完成后读取的目标实际版本。
; upgrade 为升级，downgrade 为降级；降级任务不可填写后台任务的配置版本。
; ============================================================================

[app.upgrade]
; APP 升级
task_id=0
version=

[app.downgrade]
; APP 降级
task_id=0
version=

